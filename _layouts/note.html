---
layout: default
---
<article class="note">
  <header>
    <h1>{{ page.title }}</h1>
    <p class="meta">{{ page.date | date: "%b %d, %Y" }}</p>
    {% if page.summary %}
      <p class="summary">{{ page.summary }}</p>
    {% endif %}
  </header>
  <div class="note-body">
    {{ content }}
  </div>
</article>
