title: "Kushal Garg" # FILL: replace with your name
# email: "" # 
description: "Writing about Mathematics, physics and AI, cause why not? 😉"
url: "https://kushalgarg101.github.io"
baseurl: ""

markdown: kramdown
permalink: /blog/:year/:month/:day/:title/

collections:
  notes:
    output: true
    permalink: /notes/:name/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
  - scope:
      path: ""
      type: "notes"
    values:
      layout: note

plugins:
  - jekyll-feed

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
